<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Laerte Está Viva Hoje?</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #111, #333);
            color: white;
            text-align: center;
            padding-top: 15%;
        }
        h1 {
            font-size: 2.5rem;
        }
        .status {
            font-size: 3rem;
            margin-top: 20px;
            color: #00ff88;
            font-weight: bold;
        }
        .update {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #ccc;
        }
        .footer {
            position: fixed;
            bottom: 10px;
            width: 100%;
            font-size: 0.8rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>Laerte está viva hoje?</h1>
    <div class="status" id="status">Verificando...</div>
    <div class="update" id="update"></div>

    <div class="footer">
        Este site é uma sátira sem fins lucrativos.
    </div>

    <script>
        function atualizarStatus() {
            const status = document.getElementById("status");
            const update = document.getElementById("update");

            status.innerHTML = "✅ Sim.";
            update.innerHTML = "Última atualização: " + new Date().toLocaleString("pt-BR");
        }

        atualizarStatus();
        setInterval(atualizarStatus, 5000);
    </script>
</body>
</html>
